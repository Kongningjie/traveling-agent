name: traveling-agent

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-traveling_agent}
      POSTGRES_USER: ${POSTGRES_USER:-traveling_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请复制 .env.example 为 .env 并设置密码}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.11-bookworm
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: bootstrap/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_ADDRESS: 0.0.0.0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-traveling_agent}
      POSTGRES_USER: ${POSTGRES_USER:-traveling_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}
      TRAVEL_ARTIFACTS_ROOT: /var/lib/traveling-agent/artifacts
      TRAVEL_DOCUMENTS_ROOT: /var/lib/traveling-agent/documents
      DOCUMENT_RUNNER_URL: http://host.docker.internal:8766
      DOCUMENT_PARSER_SECRET: ${DOCUMENT_PARSER_SECRET:-}
      DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES:-10485760}
      DOCUMENT_MAX_PAGES: ${DOCUMENT_MAX_PAGES:-100}
      DOCUMENT_MAX_TEXT: ${DOCUMENT_MAX_TEXT:-200000}
      DOCUMENT_MAX_EXPANDED: ${DOCUMENT_MAX_EXPANDED:-52428800}
      DOCUMENT_MAX_SECONDS: ${DOCUMENT_MAX_SECONDS:-60}
      DOCUMENT_MAX_PER_CHAT: ${DOCUMENT_MAX_PER_CHAT:-10}
      DOCUMENT_MAX_USER_BYTES: ${DOCUMENT_MAX_USER_BYTES:-209715200}
      DOCUMENT_MAX_USER_TEXT: ${DOCUMENT_MAX_USER_TEXT:-1000000}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - agent-files:/var/lib/traveling-agent
      - ./.runtime/documents:/var/lib/traveling-agent/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 20s
    stop_grace_period: 30s

  web:
    profiles: ["app"]
    build:
      context: web
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://127.0.0.1/actuator/health"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  agent-files:
