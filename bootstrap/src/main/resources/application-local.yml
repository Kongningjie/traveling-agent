spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:traveling_agent}?currentSchema=traveling_agent
    username: ${POSTGRES_USER:traveling_agent}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 5000
  flyway:
    enabled: true
    schemas: traveling_agent
    default-schema: traveling_agent
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      connect-timeout: 3s
      timeout: 3s
  session:
    timeout: 30m
    servlet:
      # 首次请求保存会话；SSE 异步完成不再保存旧请求缓存，避免退出后重新保存已撤销会话。
      # 传输过程中由 SubscriptionAccess 从 Redis 持续重核，会话到期不因心跳延长。
      filter-dispatcher-types: request,error
    redis:
      namespace: traveling-agent:local:session
mybatis:
  configuration:
    map-underscore-to-camel-case: true

# 仅本地 HTTP 开发例外；未来 HTTPS 环境必须启用 Secure。
server:
  servlet:
    session:
      cookie:
        secure: false

travel:
  documents:
    root: ${TRAVEL_DOCUMENTS_ROOT:.runtime/documents}
    runner: ${DOCUMENT_RUNNER_URL:http://127.0.0.1:8766}
