spring:
  config:
    import:
      - optional:file:./config/tool-quota.local.yml
  application:
    name: traveling-agent
  profiles:
    default: local
logging:
  level:
    # 框架可能记录提示词、工具内容或供应商异常；业务层只保留脱敏分类和计量。
    io.agentscope: OFF
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
travel:
  runtime:
    mode: local
  external-calls-enabled: false
  models:
    coordinator: qwen3.8-flash
    research: qwen3.8-flash
    planner: qwen3.8-flash
    reviewer: qwen3.8-max-0902
  limits:
    active-runs: 2
    model-concurrency: 4
    research-concurrency-per-run: 2
    model-calls-per-run: 30
    tool-calls-per-run: 60
    repair-rounds: 2
    model-timeout: 180s
    active-time-per-run: 15m
